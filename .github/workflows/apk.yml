name: Build APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: oven-sh/setup-bun@v2

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Fetch ECJ compiler
        run: curl -sSL -o /tmp/ecj.jar https://repo1.maven.org/maven2/org/eclipse/jdt/ecj/3.33.0/ecj-3.33.0.jar

      - name: Build APK (static export → aapt2 → ecj → d8 → sign)
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: bash scripts/build-apk.sh --fresh

      - name: Verify bundled assets resolve
        run: node scripts/verify-apk-assets.cjs

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: oniLibrary-apk
          path: download/*.apk
          if-no-files-found: error
