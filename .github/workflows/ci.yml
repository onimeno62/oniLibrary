name: CI

# Quality gate recommended by docs/SECURITY_AND_QA_CHECKLIST.md §6:
# lint + typecheck + regression suite on every push/PR touching the app.
# The APK build itself stays in apk.yml (manual dispatch).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (eslint)
        run: bun run lint

      - name: Typecheck (tsc --noEmit)
        run: bunx tsc --noEmit

      - name: Regression suite (bun test)
        run: bun run test

      - name: Asset verifier (no APK → skipped gracefully)
        run: |
          APK=$(ls download/*.apk 2>/dev/null | sort | tail -1 || true)
          if [ -n "$APK" ]; then
            node scripts/verify-apk-assets.cjs "$APK"
          else
            echo "No APK in download/ on this branch — asset verification runs in apk.yml."
          fi
